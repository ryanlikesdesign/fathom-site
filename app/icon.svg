<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --c: #0e1013; }
    @media (prefers-color-scheme: dark) { :root { --c: #e8e4db; } }
  </style>
  <!-- Center dot — solid fill, large enough to read at 16px -->
  <circle cx="16" cy="16" r="3.5" fill="var(--c)"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="var(--c)" stroke-width="2"/>
  <!-- Middle ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="var(--c)" stroke-width="1.5" opacity="0.65"/>
  <!-- Outer ring — subtle, gives the sonar depth -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="var(--c)" stroke-width="1" opacity="0.3"/>
</svg>
