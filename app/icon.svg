<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The app icon at favicon size: the bone mark (bone-100) on fathom-900,
       as design-system/vendor/logos/fathom-app-icon.svg draws it. The mark
       is the pixel-fitted 16 master (MARK[16] in
       design-system/generated/logo-paths.ts) on a 16 tile, untransformed:
       a browser tab draws favicons at 16 CSS px, so on a 1x screen every
       ring edge lands on a whole pixel, and at 2x on an even one. Drawn at
       1:1 inside a 32 box instead, a 1x tab halves it and the rings blur
       into one disc. test/metadata.test.ts holds the path, the box and the
       colors to the design system. -->
  <rect width="16" height="16" fill="#1a3b52"/>
  <path fill="#f2ede4" fill-rule="evenodd" d="M10,8 A2,2 0 1 1 6,8 A2,2 0 1 1 10,8 Z M13,8 A5,5 0 1 1 3,8 A5,5 0 1 1 13,8 Z M11,8 A3,3 0 1 1 5,8 A3,3 0 1 1 11,8 Z M15,8 A7,7 0 1 1 1,8 A7,7 0 1 1 15,8 Z M14,8 A6,6 0 1 1 2,8 A6,6 0 1 1 14,8 Z"/>
</svg>
