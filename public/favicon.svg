<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <style>
    :root { --c: #0e1013; }
    @media (prefers-color-scheme: dark) { :root { --c: #e8e4db; } }
  </style>
  <!-- Center dot -->
  <circle cx="60" cy="60" r="7" fill="var(--c)"/>
  <!-- Ring 1 -->
  <circle cx="60" cy="60" r="18" fill="none" stroke="var(--c)" stroke-width="2.2" opacity="0.85"/>
  <!-- Ring 2 -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="var(--c)" stroke-width="1.8" opacity="0.55"/>
  <!-- Ring 3 -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="var(--c)" stroke-width="1.4" opacity="0.3"/>
</svg>
